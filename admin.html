<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ-панель — питомник «ДарЛес»</title>
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
<!-- АНТИКЭШ: браузер и CDN должны каждый раз проверять новую версию -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="images/site/6.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=9">
<link rel="stylesheet" href="css/admin.css?v=9">
</head>
<body>
<!-- Плашка ошибок: если в панели сломался скрипт — текст ошибки виден прямо тут -->
<div id="jsErrBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#b3261e;color:#fff;padding:10px 16px;font:14px/1.45 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25)"></div>
<script>
  function showJsErr(msg) {
    try {
      const b = document.getElementById("jsErrBanner");
      if (b) {
        b.textContent = "⚠️ Ошибка панели: " + msg + " — пришлите этот текст в чат Arena.";
        b.style.display = "block";
      }
    } catch (e) {}
    console.error("ПАНЕЛЬ:", msg);
  }
  window.addEventListener("error", function (e) {
    const where = e.filename ? " (" + String(e.filename).split("/").pop() + (e.lineno ? ":" + e.lineno : "") + ")" : "";
    showJsErr((e.message || "неизвестная ошибка") + where);
  });
  window.addEventListener("unhandledrejection", function (e) {
    const m = (e.reason && (e.reason.message || String(e.reason))) || "неизвестная ошибка";
    showJsErr(m);
  });
</script>
<script>
  function bootAdminPanel() {
    document.title = "Админ-панель — питомник «ДарЛес»";

    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src + "?v=9"; s.onload = res; s.onerror = () => rej(new Error("Не удалось загрузить " + src));
        document.body.appendChild(s);
      });
    }

    (async () => {
      try {
        const resp = await fetch("js/panel.inc?v=9", { cache: "no-store" });
        if (!resp.ok) throw new Error("Не удалось загрузить панель");
        document.body.innerHTML = await resp.text();

        await loadScript("js/products.js");
        // загрузчик «живого» каталога с хостинга (data/catalog.json)
        await loadScript("js/catalog-loader.js");
        await CatalogServer.ping();       // определить: серверный режим или статический
        await CatalogServer.load();       // подменить PRODUCTS данными с сервера
        await loadScript("js/site.js");
        await loadScript("js/photo-editor.js");
        await loadScript("js/admin-ai.js");
        await loadScript("js/plant-id.js");
        await loadScript("js/admin.js");
        renderHeader("admin");
        renderFooter();
        document.getElementById("btnLogout").addEventListener("click", () => {
          if (confirm("Выйти из админ-панели?")) location.href = "index.html";
        });
      } catch (e) {
        document.body.innerHTML =
          '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#b3261e">' +
          'Ошибка загрузки панели: ' + String(e.message) + '<br><br>' +
          '<a href="index.html" style="color:#3c6b4c">← На главную</a></div>';
      }
    })();
  }

  // Вход по паролю отключён: панель открыта (решение владельца, 09.09.2026)
  bootAdminPanel();
</script>
</body>
</html>
